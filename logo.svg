<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lens-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B8CC4" />
      <stop offset="100%" stop-color="#D4A54A" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Aperture — iris ring -->
  <path d="M20 4L23 10H34L30 16L36 26H28L26 34L20 28L14 34L12 26H4L10 16L6 10H17L20 4Z" 
        stroke="url(#lens-gradient)" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        opacity="0.85"
        style="transform-origin: 20px 20px;" />

  <!-- Inner Iris Ring -->
  <circle cx="20" cy="20" r="6" stroke="#3B8CC4" stroke-width="1.5" stroke-opacity="0.9" />
  
  <!-- Pupil -->
  <circle cx="20" cy="20" r="3" fill="#060608" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Scan Lines -->
  <path d="M2 20H8 M32 20H38 M20 2V8 M20 32V38" stroke="#3B8CC4" stroke-width="1" stroke-linecap="round" opacity="0.5" />
</svg>
